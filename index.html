<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Konzultációk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Konzultációk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EDF1F3;
  --surface: #FFFFFF;
  --ink: #15232B;
  --muted: #5B6D76;
  --line: #D5DDE1;
  --brand: #0E5A6B;
  --brand-ink: #FFFFFF;
  --brand-soft: #DAEAEE;
  --plan: #2B5FA6;     --plan-soft: #E0EAF8;
  --held: #28775A;     --held-soft: #DCF0E5;
  --noshow: #B03F2C;   --noshow-soft: #F8E2DC;
  --cancel: #5F6C74;   --cancel-soft: #E6EAEC;
  --resched: #82560A;  --resched-soft: #FAEAC6;
  --focus: #1B7FC4;
  --radius: 16px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E181D;
    --surface: #162329;
    --ink: #E6EEF1;
    --muted: #94A7B0;
    --line: #27383F;
    --brand: #58B4C7;
    --brand-ink: #08242B;
    --brand-soft: #1B3A44;
    --plan: #8DB5EE;     --plan-soft: #1D3050;
    --held: #6FCB9F;     --held-soft: #173B2D;
    --noshow: #F09A88;   --noshow-soft: #4A2219;
    --cancel: #A6B4BB;   --cancel-soft: #26343A;
    --resched: #EAC470;  --resched-soft: #3F3011;
    --focus: #72BDF0;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 17px/1.4 Figtree, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

#app {
  max-width: 680px;
  margin: 0 auto;
  min-height: 100dvh;
  padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));
}
#app.has-bar { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }

/* Fejléc */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) 14px 10px 14px;
  background: var(--bg);
}
.topbar .grow { flex: 1; min-width: 0; }
.topbar h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.topbar .sub { margin-top: 2px; color: var(--muted); font-size: 15px; }
.iconbtn {
  flex: none; width: 46px; height: 46px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: transparent; cursor: pointer;
}
.iconbtn:active { background: var(--brand-soft); }
.linkbtn {
  flex: none; min-height: 46px; padding: 0 12px; border: 0; background: transparent;
  color: var(--brand); font-weight: 600; cursor: pointer; border-radius: 12px;
  display: inline-flex; align-items: center; gap: 6px;
}
.ic { width: 24px; height: 24px; flex: none; }
.ic.sm { width: 18px; height: 18px; }
.spin .ic { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

main { padding: 4px 14px 0; }
section { margin-top: 22px; }
section:first-child { margin-top: 8px; }
h2 { margin: 0 0 10px; font-size: 19px; font-weight: 700; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h2 small { font-size: 14px; font-weight: 600; color: var(--muted); }

/* Gombok */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 54px; padding: 0 20px; border-radius: 14px;
  border: 1.5px solid transparent; font-weight: 600; cursor: pointer; text-align: center;
}
.btn:disabled { opacity: 0.55; cursor: default; }
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-block { width: 100%; }
.actions2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Kártyák és listák */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card + .card { margin-top: 10px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list > .card { margin: 0; }
.empty { padding: 20px 16px; text-align: left; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty .btn { margin-top: 12px; }
.notice { padding: 14px 16px; border-radius: var(--radius); background: var(--resched-soft); color: var(--resched); font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.notice .btn { min-height: 44px; padding: 0 16px; background: var(--resched); color: var(--resched-soft); }
.errorbar { margin: 4px 14px 0; padding: 12px 14px; border-radius: 12px; background: var(--noshow-soft); color: var(--noshow); font-weight: 600; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.errorbar button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; min-height: 40px; }

/* Státusz jelvények */
.badge { display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.b-plan { background: var(--plan-soft); color: var(--plan); }
.b-held { background: var(--held-soft); color: var(--held); }
.b-noshow { background: var(--noshow-soft); color: var(--noshow); }
.b-cancel { background: var(--cancel-soft); color: var(--cancel); }
.b-resched { background: var(--resched-soft); color: var(--resched); }

/* Alkalmak sávja: a megtartott / betervezett / még szabad alkalmak egy pillantásra */
.rail { display: flex; gap: 4px; margin: 10px 0 6px; }
.rail i { flex: 1 1 0; min-width: 4px; height: 12px; border-radius: 4px; border: 1.5px solid var(--line); }
.rail i.held { background: var(--held); border-color: var(--held); }
.rail i.noshow { background: var(--noshow-soft); border-color: var(--noshow); }
.rail i.sched { background: var(--plan-soft); border-color: var(--plan); }
.rail-note { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 14.5px; color: var(--muted); }
.rail-note b { color: var(--ink); font-weight: 700; }
.mini { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; }

/* Eset kártya */
.case { display: block; }
.case-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.case-name { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.case-id { color: var(--muted); font-size: 14.5px; font-variant-numeric: tabular-nums; }
.case-next { margin-top: 6px; font-size: 14.5px; color: var(--muted); }

/* Ülés sor */
.srow {
  width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
  min-height: 72px; padding: 12px 14px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line); cursor: pointer;
}
.srow:active { background: var(--brand-soft); }
.srow-time { flex: none; width: 58px; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.srow-time b { font-size: 18px; line-height: 1.15; }
.srow-time i { font-style: normal; font-size: 14px; color: var(--muted); }
.srow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.srow-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow-meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14.5px; }
.srow.dim { opacity: 0.62; }
.dayhead { margin: 18px 2px 8px; font-weight: 700; font-size: 15.5px; color: var(--muted); }
.dayhead:first-child { margin-top: 4px; }

/* Szűrők */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface); font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px;
}
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.chip .n { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--resched); color: var(--resched-soft); font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
.search { position: relative; margin-bottom: 10px; }
.search input { padding-left: 16px; }

/* Űrlapok */
.fld { display: block; margin-bottom: 18px; }
.fld > span { display: block; margin: 0 0 6px 2px; font-weight: 600; font-size: 15.5px; }
.fld > span em { font-style: normal; font-weight: 400; color: var(--muted); }
input[type=text], input[type=search], input[type=tel], input[type=email], input[type=date], input[type=time], input[type=number], input[type=password], select, textarea {
  width: 100%; min-height: 54px; padding: 12px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 22px) 24px, calc(100% - 16px) 24px; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
textarea { min-height: 96px; resize: vertical; }
input:disabled { opacity: 0.7; }
.tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.check { display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.check input { width: 26px; height: 26px; margin: 0; accent-color: var(--brand); flex: none; }
.check small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
.phone { display: flex; }
.phone .pre { display: flex; align-items: center; padding: 0 14px; min-height: 54px; border: 1.5px solid var(--line); border-right: 0; border-radius: 12px 0 0 12px; background: var(--bg); font-weight: 700; }
.phone input { flex: 1; min-width: 0; border-radius: 0 12px 12px 0 !important; }
.row-32 { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; }
.row-32 .phone .pre { padding: 0 10px; }
.row-32 .phone input { padding-left: 10px; padding-right: 6px; }
.row2 .stepper { grid-template-columns: 44px 1fr 44px; gap: 6px; }
.row2 .stepper input { padding: 12px 2px; font-size: 18px; }
.topact { margin-bottom: 14px; }
/* Heti naptár */
.cal { --rh: 44px; }
.cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.cal-title { flex: 1; text-align: center; font-weight: 700; }
.cal-grid { display: grid; grid-template-columns: 34px repeat(7, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.cal-dh { text-align: center; padding: 6px 0 4px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); line-height: 1.2; }
.cal-dh b { display: block; font-size: 15px; color: var(--ink); }
.cal-dh.today b { background: var(--brand); color: var(--brand-ink); border-radius: 999px; width: 24px; height: 24px; line-height: 24px; margin: 2px auto 0; }
.cal-times div { height: var(--rh); font-size: 11px; color: var(--muted); text-align: right; padding: 2px 4px 0 0; font-variant-numeric: tabular-nums; }
.cal-col { position: relative; border-left: 1px solid var(--line); }
.slot { display: block; width: 100%; height: var(--rh); border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 0; cursor: pointer; }
.slot:active { background: var(--brand-soft); }
.cal-ev { position: absolute; left: 1px; right: 1px; z-index: 2; border: 0; border-left: 3px solid currentColor; border-radius: 6px; font-size: 11px; font-weight: 700; padding: 1px 1px; overflow: hidden; cursor: pointer; text-align: center; line-height: 1.15; }
.ev-plan { background: var(--plan-soft); color: var(--plan); }
.ev-held { background: var(--held-soft); color: var(--held); }
.ev-noshow { background: var(--noshow-soft); color: var(--noshow); }
.cal-sel { position: absolute; left: 1px; right: 1px; z-index: 1; border: 2px dashed var(--brand); border-radius: 6px; background: var(--brand-soft); pointer-events: none; }
.cal-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--noshow); z-index: 3; pointer-events: none; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.ev-ext { background: var(--cancel-soft); color: var(--cancel); z-index: 1; font-size: 10px; font-weight: 600; text-align: left; word-break: break-word; }
.cal-adlab { font-size: 10px; color: var(--muted); text-align: right; padding: 4px 4px 0 0; border-bottom: 1px solid var(--line); line-height: 1.2; }
.cal-ad { border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 2px; min-height: 22px; }
.cal-adb { width: 100%; border: 0; border-radius: 4px; background: var(--cancel-soft); color: var(--cancel); font-size: 10px; font-weight: 600; padding: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; cursor: pointer; }
.cal-load { font-weight: 400; color: var(--muted); }
.calbox { margin-bottom: 18px; }
.calbox summary { cursor: pointer; font-weight: 600; font-size: 15.5px; min-height: 44px; display: flex; align-items: center; }

.expnote { margin: 8px 2px 0; font-size: 14.5px; color: var(--muted); }
.expnote.bad { color: var(--noshow); font-weight: 600; }
.expnote.warn { color: var(--resched); font-weight: 600; }
.srow.late .srow-time b { color: var(--noshow); }
.listblk h3, .tblhead { margin: 16px 0 6px; font-size: 16px; }
.listblk .exports { margin: 10px 0 0; }
.srow.static { cursor: default; }
.srow.static:active { background: var(--surface); }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: 15px; }
.fulist { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; }
.fulist div { padding: 8px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.fulist div:last-child { border-bottom: 0; }
.fulist span { color: var(--muted); font-size: 14.5px; }
.invtext { font-variant-numeric: tabular-nums; line-height: 1.5; overflow-wrap: anywhere; }
.aianswer { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.row2 input[type=date] { padding: 12px 8px; font-size: 16px; }
.combo { position: relative; }
.combo input { padding-right: 52px; }
.combo-btn { position: absolute; right: 2px; top: 2px; width: 50px; height: 50px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.combo-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 35; max-height: 232px; overflow-y: auto; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(8, 20, 26, 0.18); }
.combo-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 46px; padding: 0 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; font-weight: 600; cursor: pointer; }
.combo-item:last-child { border-bottom: 0; }
.combo-item:active { background: var(--brand-soft); }
.combo-item small { color: var(--muted); font-weight: 400; }
.cat-sug { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.cat-sug::-webkit-scrollbar { display: none; }
.cat-sug:empty { display: none; }
.chip.sm { min-height: 38px; padding: 0 14px; font-size: 15px; }
.case-cat { margin-top: 2px; font-size: 14.5px; color: var(--muted); }
.fld.err input, .fld.err select, .fld.err textarea { border-color: var(--noshow); }
.fld .msg { display: none; margin: 6px 2px 0; color: var(--noshow); font-size: 14.5px; font-weight: 600; }
.fld.err .msg { display: block; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stepper { display: grid; grid-template-columns: 54px 1fr 54px; gap: 8px; }
.stepper .btn { padding: 0; min-height: 54px; font-size: 24px; }
.stepper input { text-align: center; font-weight: 700; font-size: 20px; }
.quick { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.quick button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; cursor: pointer; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 68px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15.5px; }
.seg input:checked + span { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
}
.actionbar > div { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }

/* Eset részletei */
.contact { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.desc { margin: 12px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-top: 14px; }
.tile { padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.tile b { display: block; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13.5px; color: var(--muted); }
.tile.t-held b { color: var(--held); }
.tile.t-noshow b { color: var(--noshow); }
.tile.t-plan b { color: var(--plan); }

/* Alsó navigáció */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav > div { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav a { height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.nav a[aria-current="page"] { color: var(--brand); }

/* Lap (bottom sheet) */
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: rgba(8, 20, 26, 0.5); }
.sheet-panel {
  position: relative; width: 100%; max-width: 680px; max-height: 88dvh; overflow-y: auto;
  background: var(--surface); border-radius: 22px 22px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  animation: rise 0.18s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
.sheet-h b { font-size: 20px; display: block; overflow-wrap: anywhere; }
.sheet-h span { color: var(--muted); font-size: 15px; }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sbtn { min-height: 58px; border-radius: 14px; border: 2px solid transparent; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.sbtn.b-plan, .sbtn.b-held, .sbtn.b-noshow, .sbtn.b-cancel, .sbtn.b-resched { font-size: 17px; padding: 0 10px; }
.sbtn.cur { border-color: currentColor; }
.sgrid .sbtn:last-child:nth-child(odd) { grid-column: 1 / -1; }
.sbtn:disabled { opacity: 0.6; }
.sheet-meet { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.sheet-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  top: calc(10px + env(safe-area-inset-top));

}
.toast.err { background: var(--noshow); color: #fff; }

/* Lekérdezések */

.tablewrap th, .tablewrap td { padding: 10px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }

<body>
<div id="app"></div>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-act="close-sheet"></div>
  <div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" hidden role="status"><span id="toast-msg"></span><button type="button" class="toast-x" data-act="close-toast" aria-label="Bezárás">&times;</button></div>

<script>
'use strict';

/* ================================================================
   BEÁLLÍTÁS – ide másold be az Apps Script web app /exec URL-jét
   ================================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbyb-OhlfTVArb0w3Hyf4koi_xBx5EeBw2gdqta4ncyIVonRP_GAWJi9PFnLzA2f0vPH/exec',
  CACHE_DATA: true   // az utolsó adatokat eltárolja a telefonon a gyorsabb induláshoz
};
const AGE_OPTIONS = ['18–19', '20–29', '30–39', '40–49', '50–59', '60–69', '70+'];
const DEFAULT_PRICE = 8000;   // egy 50 perces alkalom alapára (HUF)
const SESSION_MINUTES = 50;  // egy alkalom alapértelmezett hossza (perc)
const ST = { PLANNED: 'Tervezett', HELD: 'Megtartva', NOSHOW: 'Nem jelent meg' };

/* ---------------- Segédek ---------------- */
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const parseD = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const mondayOf = s => addDays(s, -((parseD(s).getDay() + 6) % 7));
const addMin = (t, m) => { const p = t.split(':').map(Number); const x = Math.min(p[0] * 60 + p[1] + m, 23 * 60 + 59); return pad(Math.floor(x / 60)) + ':' + pad(x % 60); };
const fmtShort = s => parseD(s).toLocaleDateString('hu-HU', { month: 'short', day: 'numeric' });
const fmtLong = s => parseD(s).toLocaleDateString('hu-HU', { weekday: 'long', month: 'short', day: 'numeric' });
const fmtDay = s => {
  const t = todayStr();
  const rel = s === t ? 'Ma, ' : s === addDays(t, 1) ? 'Holnap, ' : s === addDays(t, -1) ? 'Tegnap, ' : '';
  return rel + fmtLong(s);
};
const nowKey = () => todayStr() + ' ' + nowTime();
const startKey = s => s.Datum + ' ' + s.Kezdes;
const endKey = s => s.Datum + ' ' + s.Vege;

/* Eset lejárata: a kezdettől számított 3 hónap */
const EXPIRY_MONTHS = 3;
const EXPIRY_WARN_DAYS = 7;
function addMonthsStr(str, n) {
  const p = str.split('-').map(Number);
  const lastDay = new Date(p[0], p[1] - 1 + n + 1, 0).getDate();
  const first = new Date(p[0], p[1] - 1 + n, 1);
  return ymd(new Date(first.getFullYear(), first.getMonth(), Math.min(p[2], lastDay)));
}
function startOf(c) {
  const m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(c.Letrehozva || '');
  return m ? m[1] + '-' + pad(m[2]) + '-' + pad(m[3]) : '';
}
function expiryOf(c) {
  const st = startOf(c);
  return st ? addMonthsStr(st, EXPIRY_MONTHS) : '';
}
const daysUntil = dateStr => Math.round((parseD(dateStr) - parseD(todayStr())) / 86400000);
function expiringCases() {
  return state.data.cases
    .filter(c => c.Statusz !== 'Lezárt' && expiryOf(c) && daysUntil(expiryOf(c)) <= EXPIRY_WARN_DAYS)
    .sort((a, b) => expiryOf(a).localeCompare(expiryOf(b)));
}

/* Telefonszám: a +36 utáni részt kérjük be, +36-tal tároljuk */
function huLocal(raw) {
  let t = String(raw || '').trim().replace(/[\s().\-\/]/g, '');
  if (t.indexOf('+36') === 0) t = t.slice(3);
  else if (t.indexOf('0036') === 0) t = t.slice(4);
  else if (t.indexOf('06') === 0) t = t.slice(2);
  return t.replace(/\D/g, '');
}
function formatPhone(p) {
  const m9 = /^\+36(\d{2})(\d{3})(\d{4})$/.exec(p);
  if (m9) return '+36 ' + m9[1] + ' ' + m9[2] + ' ' + m9[3];
  const bp = /^\+36(1)(\d{3})(\d{4})$/.exec(p);
  if (bp) return '+36 1 ' + bp[2] + ' ' + bp[3];
  const m8 = /^\+36(\d{2})(\d{3})(\d{3})$/.exec(p);
  if (m8) return '+36 ' + m8[1] + ' ' + m8[2] + ' ' + m8[3];
  return p;
}

const ICON = {
  home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.7.2 4.5 2 4.5 5.3"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  next: '<path d="M9 5l7 7-7 7"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  video: '<rect x="3" y="6.5" width="12.5" height="11" rx="2.5"/><path d="M15.5 10.5l5-3v9l-5-3"/>',
  chat: '<path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A15 15 0 0 1 4 5a1 1 0 0 1 1-1z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>'
};
const icon = (n, cls) => `<svg class="ic ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[n] || ''}</svg>`;
const typeIcon = t => icon(t === 'Video' ? 'video' : t === 'Chat' ? 'chat' : t === 'Telefon' ? 'phone' : 'cal', 'sm');

const STATUS_CLASS = {
  'Tervezett': 'plan', 'Megtartva': 'held', 'Nem jelent meg': 'noshow',
  'Aktív': 'held', 'Lezárt': 'cancel'
};
const stClass = s => STATUS_CLASS[s] || 'plan';
const MEET_PREFIX = 'https:' + String.fromCharCode(47, 47) + 'meet.google.com/';
const meetUrl = s => (s.Meet_link && s.Meet_link.indexOf(MEET_PREFIX) === 0) ? s.Meet_link : '';
const badge = s => `<span class="badge b-${stClass(s)}">${esc(s)}</span>`;

/* ---------------- Állapot ---------------- */
const state = {
  token: ls.get('kn_token') || '',
  data: null,
  loading: false,
  loadError: '',
  authError: '',
  q: '',
  caseFilter: 'Aktív',
  caseSort: 'next',
  sessFilter: 'upcoming',
  sessSkip: {},
  cal: { week: mondayOf(todayStr()) },
  pick: { week: '' },
  ext: {},
  rep: { period: 'month', from: '', to: '', query: 'all', price: DEFAULT_PRICE, aiPrompt: '', aiAnswer: '', aiBusy: false, aiError: '', aiInfo: '' }
};
{ const p = ls.get('kn_price'); if (p !== null && !isNaN(Number(p))) state.rep.price = Math.max(0, Number(p)); }
if (CONFIG.CACHE_DATA) {
  try { const c = ls.get('kn_cache'); if (c) state.data = JSON.parse(c); } catch (e) {}
}

const caseById = id => state.data && state.data.cases.find(c => c.Esetszam === id);
const sessionById = id => state.data && state.data.sessions.find(s => s.Foglalkozas_ID === id);
const sessionsOf = id => state.data.sessions.filter(s => s.Esetszam === id);
const pendingSessions = () => state.data.sessions.filter(s => s.Statusz === ST.PLANNED && endKey(s) < nowKey());

/* ---------------- Szerver hívások ---------------- */
const inAppsScript = () => !!(window.google && google.script && google.script.run);
const apiReady = () => inAppsScript() || (CONFIG.API_URL && CONFIG.API_URL.indexOf('IDE_') !== 0);

async function call(action, data) {
  if (!apiReady()) throw new Error('Az index.html elején add meg az API_URL értékét.');
  const body = JSON.stringify({ token: state.token, action: action, data: data });
  let json;
  if (inAppsScript()) {
    // Az Apps Script által kiszolgált oldalon nincs CORS-gond: google.script.run
    try {
      const text = await new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve)
          .withFailureHandler(err => reject(new Error((err && err.message) || 'Szerverhiba.')))
          .apiCall(body);
      });
      json = JSON.parse(text);
    } catch (e) { throw new Error(e.message || 'Szerverhiba.'); }
  } else {
    let res;
    try {
      res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: body,
        redirect: 'follow'
      });
    } catch (e) {
      throw new Error('Nincs kapcsolat a szerverrel.');
    }
    try { json = await res.json(); } catch (e) {
      throw new Error('Váratlan válasz a szervertől. Ellenőrizd, hogy a web app hozzáférése „Bárki”.');
    }
  }
  if (!json.ok) {
    if (json.code === 'AUTH') {
      state.token = ''; ls.del('kn_token');
      state.authError = 'Hibás hozzáférési kód. Add meg újra.';
      render();
    }
    throw new Error(json.error || 'Ismeretlen hiba.');
  }
  if (json.data) {
    state.data = json.data;
    if (CONFIG.CACHE_DATA) ls.set('kn_cache', JSON.stringify(json.data));
  }
  return json;
}

async function loadData() {
  if (!state.token) return;
  state.loading = true; state.loadError = '';
  updateRefreshIcon();
  try { await call('init'); state.ext = {}; }
  catch (e) { state.loadError = e.message; }
  state.loading = false;
  if (!isFormRoute()) render(true); else updateRefreshIcon();
}

function updateRefreshIcon() {
  const b = $('[data-act="refresh"]');
  if (b) b.classList.toggle('spin', state.loading);
}

/* ---------------- Útvonalak ---------------- */
function route() {
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, query] = h.split('?');
  const params = new URLSearchParams(query || '');
  const p = path.split('/').filter(Boolean).map(decodeURIComponent);
  return { p, params };
}
function isFormRoute() {
  const { p } = route();
  return (p[0] === 'case' && (p[1] === 'new' || p[2] === 'edit')) || (p[0] === 'session' && (p[1] === 'new' || p[2] === 'edit'));
}
function go(hash, replace) {
  if (replace) location.replace(hash); else location.hash = hash;
}

/* ---------------- Nézetek ---------------- */
function topbar(o) {
  return `<header class="topbar">
    ${o.back ? `<button class="iconbtn" data-act="back" aria-label="Vissza">${icon('back')}</button>` : ''}
    <div class="grow"><h1>${esc(o.title)}</h1>${o.sub ? `<div class="sub">${o.sub}</div>` : ''}</div>
    ${o.right || ''}
  </header>`;
}
const refreshBtn = () => `<button class="iconbtn ${state.loading ? 'spin' : ''}" data-act="refresh" aria-label="Frissítés">${icon('refresh')}</button>`;

function nav(active) {
  const item = (href, key, ic, label) =>
    `<a href="${href}" ${active === key ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></a>`;
  return `<nav class="nav"><div>
    ${item('#/', 'home', 'home', 'Kezdőlap')}
    ${item('#/cases', 'cases', 'users', 'Esetek')}
    ${item('#/sessions', 'sessions', 'cal', 'Ülések')}
    ${item('#/reports', 'reports', 'chart', 'Lekérdezések')}
  </div></nav>`;
}

function errorBar() {
  return state.loadError
    ? `<div class="errorbar"><span>${esc(state.loadError)}</span><button data-act="refresh">Újra</button></div>` : '';
}

function rail(c) {
  const planned = c.Tervezett_alkalmak, s = c.stats;
  const used = s.held + s.noShow;   // a nem megjelent ülés is elhasznál egy alkalmat
  if (!planned && !used) return `<div class="rail-note">Nincs megadva tervezett alkalomszám.</div>`;
  const total = Math.max(planned, used);
  let segs = '';
  for (let i = 0; i < total; i++) {
    const cls = i < s.held ? 'held' : i < used ? 'noshow' : i < used + s.scheduled ? 'sched' : '';
    segs += `<i class="${cls}"></i>`;
  }
  const extra = s.noShow ? `<span class="mini b-noshow">${s.noShow} nem jelent meg</span>` : '';
  return `<div class="rail" role="img" aria-label="${used} ülés ${planned} alkalomból">${segs}</div>
    <div class="rail-note"><span><b>${used}</b> / ${planned} ülés</span><span>${s.remaining} hátra</span>${extra}</div>`;
}

function wosTag(c) {
  if (!c.WOS) return '';
  if (!state.data.wosDoneEnabled) return '<span class="mini b-plan">WOS kell</span>';
  return c.WOS_megvan ? '<span class="mini b-held">WOS megvan</span>' : '<span class="mini b-resched">WOS hiányzik</span>';
}
function wosText(c) {
  if (!c.WOS) return 'Nem kell';
  if (!state.data.wosDoneEnabled) return 'Kell';
  return c.WOS_megvan ? 'Kell, megvan' : 'Kell, még nincs meg';
}

function expiryTag(c) {
  const e = expiryOf(c);
  if (!e || c.Statusz === 'Lezárt') return '';
  const n = daysUntil(e);
  if (n > EXPIRY_WARN_DAYS) return '';
  return n < 0 ? '<span class="mini b-noshow">Lejárt</span>' : `<span class="mini b-resched">Lejár: ${esc(fmtShort(e))}</span>`;
}

function expiringRow(c) {
  const e = expiryOf(c), n = daysUntil(e);
  const lead = n < 0 ? 'Lejárt' : n === 0 ? 'Ma' : n + ' nap';
  return `<button class="srow ${n < 0 ? 'late' : ''}" data-act="open-case-exp" data-id="${esc(c.Esetszam)}">
    <span class="srow-time"><b>${lead}</b><i>${esc(fmtShort(e))}</i></span>
    <span class="srow-main"><span class="srow-name">${esc(c.Nev)}</span><span class="srow-meta">${esc(c.Esetszam)}</span></span>
    ${badge(c.Statusz)}
  </button>`;
}

function caseCard(c) {
  const n = c.stats.next;
  return `<a class="card case" href="#/case/${encodeURIComponent(c.Esetszam)}">
    <div class="case-top">
      <div><div class="case-name">${esc(c.Nev)}</div><div class="case-id">${esc(c.Esetszam)}</div>${c.Kategoria ? `<div class="case-cat">${esc(c.Kategoria)}</div>` : ''}</div>
      <div class="tags">${expiryTag(c)}${wosTag(c)}${badge(c.Statusz)}</div>
    </div>
    ${rail(c)}
    ${n ? `<div class="case-next">Következő: ${esc(fmtShort(n.Datum))}, ${esc(n.Kezdes)}</div>` : ''}
  </a>`;
}

function sessionRow(s, mode) {
  const c = caseById(s.Esetszam);
  const dim = '';
  if (mode === 'case') {
    return `<button class="srow${dim}" data-act="open-session" data-id="${esc(s.Foglalkozas_ID)}">
      <span class="srow-time"><b>${esc(fmtShort(s.Datum))}</b><i>${esc(parseD(s.Datum).toLocaleDateString('hu-HU', { weekday: 'short' }))}</i></span>
      <span class="srow-main"><span class="srow-name">${esc(s.Kezdes)}–${esc(s.Vege)}</span>
        <span class="srow-meta">${typeIcon(s.Tipus)} ${esc(s.Tipus)}${meetUrl(s) ? ' <span class="mini b-plan">Meet</span>' : ''}</span></span>
      ${badge(s.Statusz)}
    </button>`;
  }
  return `<button class="srow${dim}" data-act="open-session" data-id="${esc(s.Foglalkozas_ID)}">
    <span class="srow-time"><b>${esc(s.Kezdes)}</b><i>${esc(s.Vege)}</i></span>
    <span class="srow-main"><span class="srow-name">${esc(c ? c.Nev : s.Esetszam)}</span>
      <span class="srow-meta">${typeIcon(s.Tipus)} ${esc(s.Tipus)}${meetUrl(s) ? ' <span class="mini b-plan">Meet</span>' : ''}</span></span>
    ${badge(s.Statusz)}
  </button>`;
}

function groupedSessions(list) {
  if (!list.length) return '';
  let out = '', last = '';
  list.forEach(s => {
    if (s.Datum !== last) {
      if (last) out += '</div>';
      out += `<div class="dayhead">${esc(fmtDay(s.Datum))}</div><div class="list">`;
      last = s.Datum;
    }
    out += sessionRow(s, 'day');
  });
  return out + '</div>';
}


/* ---------------- Heti naptár ---------------- */
const CAL_START = 8, CAL_END = 20;
const toMin = t => { const p = String(t).split(':').map(Number); return p[0] * 60 + p[1]; };
const validTime = t => /^\d{2}:\d{2}$/.test(t || '');
const initials = n => String(n || '').trim().split(/\s+/).slice(0, 2).map(w => (w[0] || '').toUpperCase()).join('');

const EXT_TTL = 120000;
/** A Google Naptár (debre.tunde@gmail.com) eseményeinek betöltése az adott hétre; a kész adat után a naptárak frissülnek. */
function ensureExt(week) {
  const e = state.ext[week];
  if (e && (e.loading || Date.now() - e.ts < EXT_TTL)) return;
  state.ext[week] = Object.assign({}, e || { events: [], error: '', ts: 0 }, { loading: true });
  const prev = (e && e.events) || [];
  call('calendarEvents', { from: week, to: addDays(week, 6) })
    .then(res => { state.ext[week] = { ts: Date.now(), events: res.result || [], error: '' }; })
    .catch(err => { state.ext[week] = { ts: Date.now(), events: prev, error: err.message }; })
    .then(() => { refreshCal('home'); refreshCal('pick'); });
}

function extSheet(x) {
  const when = x.allDay ? 'egész nap' : x.start + '\u2013' + x.end;
  openSheet(`<div class="sheet-h">
      <div><b>${esc(x.title)}</b><span>${esc(fmtDay(x.date))}, ${esc(when)}</span></div>
      <button class="iconbtn" data-act="close-sheet" aria-label="Bezárás">${icon('x')}</button>
    </div>
    <div class="tablenote">Ez az esemény a Google Naptárból érkezik, itt nem szerkeszthető.</div>`);
}

function calendarHtml(kind, o) {
  o = o || {};
  const week = kind === 'home' ? state.cal.week : state.pick.week;
  ensureExt(week);
  const extState = state.ext[week] || { events: [], error: '' };
  const extEv = extState.events || [];
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(week, i));
  const sess = state.data.sessions.filter(s => s.Datum >= days[0] && s.Datum <= days[6] &&
    s.Foglalkozas_ID !== o.excludeId);
  let h0 = CAL_START, h1 = CAL_END;
  sess.forEach(s => { h0 = Math.min(h0, Math.floor(toMin(s.Kezdes) / 60)); h1 = Math.max(h1, Math.ceil(toMin(s.Vege) / 60)); });
  extEv.filter(x => !x.allDay).forEach(x => { h0 = Math.min(h0, Math.floor(toMin(x.start) / 60)); h1 = Math.max(h1, Math.ceil(toMin(x.end) / 60)); });
  const sel = o.sel && validTime(o.sel.start) ? o.sel : null;
  const selEnd = sel ? (validTime(sel.end) && sel.end > sel.start ? sel.end : addMin(sel.start, SESSION_MINUTES)) : '';
  if (sel) { h0 = Math.min(h0, Math.floor(toMin(sel.start) / 60)); h1 = Math.max(h1, Math.ceil(toMin(selEnd) / 60)); }
  h0 = Math.max(0, h0); h1 = Math.min(24, h1);
  const rows = h1 - h0, t = todayStr(), nowM = toMin(nowTime());
  const rh = kind === 'home' ? 44 : 38;
  const heads = days.map(d => {
    const dt = parseD(d);
    return `<div class="cal-dh ${d === t ? 'today' : ''}"><span>${esc(dt.toLocaleDateString('hu-HU', { weekday: 'short' }))}</span><b>${dt.getDate()}</b></div>`;
  }).join('');
  const times = Array.from({ length: rows }, (_, i) => `<div>${pad(h0 + i)}:00</div>`).join('');
  const cols = days.map(d => {
    const slots = Array.from({ length: rows }, (_, i) =>
      `<button class="slot" data-act="cal-slot" data-k="${kind}" data-date="${d}" data-time="${pad(h0 + i)}:00" aria-label="${esc(fmtShort(d))} ${pad(h0 + i)}:00"></button>`).join('');
    const evs = sess.filter(s => s.Datum === d).map(s => {
      const c = caseById(s.Esetszam);
      const top = (toMin(s.Kezdes) - h0 * 60) / 60, hgt = Math.max(0.3, (toMin(s.Vege) - toMin(s.Kezdes)) / 60);
      return `<button class="cal-ev ev-${stClass(s.Statusz)}" style="top:calc(var(--rh) * ${top});height:calc(var(--rh) * ${hgt})" data-act="${kind === 'home' ? 'open-session' : 'cal-busy'}" data-id="${esc(s.Foglalkozas_ID)}" aria-label="${esc((c ? c.Nev : s.Esetszam) + ' ' + s.Kezdes)}">${esc(initials(c ? c.Nev : ''))}</button>`;
    }).join('');
    const exs = extEv.filter(x => x.date === d && !x.allDay).map(x => {
      const top = (toMin(x.start) - h0 * 60) / 60, hgt = Math.max(0.3, (toMin(x.end) - toMin(x.start)) / 60);
      return `<button class="cal-ev ev-ext" style="top:calc(var(--rh) * ${top});height:calc(var(--rh) * ${hgt})" data-act="cal-ext" data-id="${esc(x.id)}" data-date="${d}" data-start="${esc(x.start)}" aria-label="${esc(x.title + ' ' + x.start)}">${esc(x.title)}</button>`;
    }).join('');
    const pv = sel && sel.date === d
      ? `<div class="cal-sel" style="top:calc(var(--rh) * ${(toMin(sel.start) - h0 * 60) / 60});height:calc(var(--rh) * ${(toMin(selEnd) - toMin(sel.start)) / 60})"></div>` : '';
    const now = d === t && nowM >= h0 * 60 && nowM < h1 * 60
      ? `<div class="cal-now" style="top:calc(var(--rh) * ${(nowM - h0 * 60) / 60})"></div>` : '';
    return `<div class="cal-col">${slots}${exs}${evs}${pv}${now}</div>`;
  }).join('');
  const adOn = d => extEv.filter(x => x.date === d && x.allDay);
  const adRow = days.some(d => adOn(d).length)
    ? `<div class="cal-adlab">egész nap</div>` + days.map(d => {
        const l = adOn(d);
        return `<div class="cal-ad">${l.length ? `<button class="cal-adb" data-act="cal-ext" data-id="${esc(l[0].id)}" data-date="${d}" data-start="">${esc(l[0].title)}${l.length > 1 ? ' +' + (l.length - 1) : ''}</button>` : ''}</div>`;
      }).join('')
    : '';
  const thisWeek = week === mondayOf(t);
  return `<div class="cal" style="--rh:${rh}px">
    <div class="cal-head">
      <button class="iconbtn" data-act="cal-prev" data-k="${kind}" aria-label="Előző hét">${icon('back')}</button>
      <div class="cal-title">${esc(fmtShort(days[0]))} – ${esc(fmtShort(days[6]))}${extState.loading ? ' <small class="cal-load">frissül…</small>' : ''}</div>
      <button class="iconbtn" data-act="cal-next" data-k="${kind}" aria-label="Következő hét">${icon('next')}</button>
      <button class="chip sm" data-act="cal-today" data-k="${kind}" ${thisWeek ? 'disabled' : ''}>Ma</button>
    </div>
    <div class="cal-grid"><div></div>${heads}${adRow}<div class="cal-times">${times}</div>${cols}</div>
    <div class="cal-legend"><span><i style="background:var(--plan)"></i>Tervezett</span><span><i style="background:var(--held)"></i>Megtartva</span><span><i style="background:var(--noshow)"></i>Nem jelent meg</span><span><i style="background:var(--cancel)"></i>Google Naptár</span>${kind === 'pick' ? '<span><i style="border:2px dashed var(--brand)"></i>Az új időpont</span>' : ''}</div>
    ${extState.error ? `<div class="tablenote">A Google Naptár eseményei nem tölthetők be: ${esc(extState.error)}</div>` : ''}
  </div>`;
}

function sessionListHtml() {
  const all = state.data.sessions, f = state.sessFilter, nk = nowKey(), t = todayStr();
  let list, empty;
  if (f === 'pending') {
    list = pendingSessions(); empty = 'Minden lezajlott ülés státusza rögzítve van.';
  } else if (f === 'past') {
    list = all.filter(s => s.Datum < t).reverse(); empty = 'Még nincs korábbi ülés.';
  } else {
    list = all.filter(s => s.Datum >= t); empty = 'Nincs közelgő ülés.';
  }
  if (!list.length) return `<div class="empty">${empty}</div>`;
  if (f === 'past') {
    // fordított sorrend: napok csökkenően, napon belül időrendben
    const days = {};
    list.forEach(s => (days[s.Datum] = days[s.Datum] || []).push(s));
    return Object.keys(days).sort().reverse().map(day =>
      `<div class="dayhead">${esc(fmtDay(day))}</div><div class="list">${days[day].sort((a, b) => a.Kezdes.localeCompare(b.Kezdes)).map(s => sessionRow(s, 'day')).join('')}</div>`
    ).join('');
  }
  return groupedSessions(list);
}

/* Kategória: szabad szöveg, a korábban használtakat felkínáljuk */
const normTxt = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function categoryList() {
  const counts = {};
  state.data.cases.forEach(c => { const k = (c.Kategoria || '').trim(); if (k) counts[k] = (counts[k] || 0) + 1; });
  return Object.keys(counts).map(n => ({ name: n, count: counts[n] }))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'hu'));
}
function categoryItemsHtml(q, showAll) {
  const nq = normTxt(q).trim();
  let list = categoryList();
  if (!showAll) {
    list = list.filter(x => normTxt(x.name).indexOf(nq) >= 0 && normTxt(x.name) !== nq);
    const starts = x => normTxt(x.name).indexOf(nq) === 0 ? 0 : 1;
    list.sort((a, b) => starts(a) - starts(b) || b.count - a.count || a.name.localeCompare(b.name, 'hu'));
  }
  return list.map(x =>
    `<button type="button" class="combo-item" data-act="pick-cat" data-v="${esc(x.name)}"><span>${esc(x.name)}</span><small>${x.count}</small></button>`).join('');
}
function showCatList(showAll) {

}
function hideCatList() { const box = $('#cat-list'); if (box) box.hidden = true; }

/* Folytatás-egyeztető levél: azoknak az aktív eseteknek, ahol nincs következő ülés megbeszélve */
const FOLLOWUP_SUBJECT = 'EAP tanácsadás – folytatás egyeztetése';   // csak a megjelenítéshez; a valódi tárgy a Code.gs-ben van
function greetingName(nev) {
  const titles = ['dr', 'prof', 'id', 'ifj', 'özv', 'néhai'];
  const t = String(nev || '').trim().split(/\s+/).filter(w => w && titles.indexOf(w.toLowerCase().replace(/\.$/, '')) < 0);
  if (!t.length) return String(nev || '').trim();
  if (t.length === 1) return t[0];
  if (t.length >= 3 && /né$/i.test(t[0])) return t[2];   // Kissné Nagy Anna > Anna
  return t[1];                                           // Kiss Anna > Anna
}
function followUpOk(c) {
  return c.Statusz === 'Aktív' && !c.stats.next && (c.stats.held + c.stats.noShow) > 0;
}
function followUpCandidates() {
  const base = state.data.cases.filter(followUpOk).sort((a, b) => a.Nev.localeCompare(b.Nev, 'hu'));
  return { withEmail: base.filter(c => c.Email), noEmail: base.filter(c => !c.Email).length };
}
const sentDate = c => (state.data.followUpTracking && /^\d{4}-\d{2}-\d{2}/.test(c.Folytatas_level || '')) ? c.Folytatas_level.slice(0, 10) : '';
function followUpRow(c) {
  const sd = sentDate(c);
  return `<div class="srow static">
    <span class="srow-main"><span class="srow-name">${esc(c.Nev)}</span>
      <span class="srow-meta">${esc(c.Esetszam)}${sd ? ', levél: ' + esc(fmtShort(sd)) : ''}</span></span>
    <button class="btn btn-ghost sm" data-act="followup-one" data-id="${esc(c.Esetszam)}">Levél</button>
  </div>`;
}
function followUpSheet(ids) {
  const cs = ids.map(caseById).filter(Boolean);
  if (!cs.length) return;
  const recent = cs.filter(c => { const d = sentDate(c); return d && (Date.now() - parseD(d).getTime()) < 14 * 86400000; });
  const warn = recent.length
    ? `<div class="notice" style="margin-bottom:12px"><span>${cs.length === 1 ? 'Erre az esetre ' + esc(fmtShort(sentDate(recent[0]))) + ' napon már ment ilyen levél.' : recent.length + ' eset az elmúlt 14 napban már kapott ilyen levelet.'}</span></div>` : '';
  const head = `<div class="sheet-h">
      <div><b>Folytatás-egyeztető levél</b><span>${cs.length === 1 ? esc(cs[0].Nev) + ', ' + esc(cs[0].Email) : cs.length + ' eset'}</span></div>
      <button class="iconbtn" data-act="close-sheet" aria-label="Bezárás">${icon('x')}</button>
    </div>`;
  const foot = `<div class="sheet-links">
      <button class="btn btn-ghost" data-act="close-sheet">Mégse</button>
      <button class="btn btn-primary" data-act="followup-send" data-ids="${esc(cs.map(c => c.Esetszam).join('|'))}">Küldés${cs.length > 1 ? ' (' + cs.length + ')' : ''}</button>
    </div>`;
  if (cs.length === 1) {
    openSheet(head + warn + `<label class="fld"><span>Megszólítás</span><input type="text" id="fu-name" value="${esc(greetingName(cs[0].Nev))}"></label>
      <div class="tablenote" style="margin:-6px 0 14px">A levél így indul: „Kedves …,”. Tárgy: ${esc(FOLLOWUP_SUBJECT)}. Ha a név nem a keresztnév, javítsd itt.</div>` + foot);
  } else {
    openSheet(head + warn + `<div class="fulist">${cs.map(c => `<div><b>Kedves ${esc(greetingName(c.Nev))},</b> <span>${esc(c.Email)}</span></div>`).join('')}</div>
      <div class="tablenote" style="margin:8px 0 14px">Tárgy: ${esc(FOLLOWUP_SUBJECT)}. A megszólítás a névből készül; ha egy név nem stimmel, küldd el egyenként.</div>` + foot);
  }
}
async function sendFollowUps(ids, btn) {
  const items = ids.map(id => ({ Esetszam: id }));
  if (ids.length === 1) { const inp = $('#fu-name'); if (inp && inp.value.trim()) items[0].Megszolitas = inp.value.trim(); }
  $('#sheet-panel').querySelectorAll('button').forEach(b => (b.disabled = true));
  if (btn) btn.textContent = 'Küldés\u2026';
  try {
    const res = await call('sendFollowUp', { items: items });
    const list = res.result || [];
    const ok = list.filter(r => r.sent).length, bad = list.filter(r => r.error);
    closeSheet();
    if (bad.length) toast((ok ? ok + ' levél elment, ' : '') + bad.length + ' nem: ' + bad.map(r => r.Esetszam + ': ' + r.error).join('; '), true);
    else toast(ok === 1 ? 'A levél elment: ' + ((caseById(ids[0]) || {}).Nev || '') : ok + ' levél elment');
    if (!isFormRoute()) render(true);
  } catch (e) {
    closeSheet();
    toast(e.message, true);
  }
}

function sessionDefaults(caseId, fromId) {

  const v = { Foglalkozas_ID: '', Esetszam: caseId || '', Datum: addDays(todayStr(), 1), Kezdes: '10:00', Vege: addMin('10:00', SESSION_MINUTES),
    Tipus: settings.types[0], Statusz: ST.PLANNED, Megjegyzes: '' };
  const from = fromId && sessionById(fromId);
  const ref = from || (caseId ? sessionsOf(caseId).slice(-1)[0] : null);
  if (ref) {
    v.Esetszam = ref.Esetszam; v.Tipus = ref.Tipus; v.Kezdes = ref.Kezdes; v.Vege = addMin(ref.Kezdes, SESSION_MINUTES);

  return v;

  const c = caseById(esetszam);

  return html + `<div class="expnote">${daysUntil(e) < 0 ? 'Az eset lejárt' : 'Az eset lejár'}: ${esc(fmtFull(e))}</div>`;
}

/* ---------------- Lekérdezések ---------------- */
const QUERIES = [
  { key: 'all', label: 'Havi kimutatás' },
  { key: 'cases', label: 'Alkalmak esetszámonként' },
  { key: 'noshow', label: 'Nem megjelenések' },
  { key: 'types', label: 'Ülés típusok' },
  { key: 'ages', label: 'Életkori megoszlás' },
  { key: 'ai', label: 'AI lekérdezés' }
];
const PERIODS = [['today', 'Ma'], ['week', 'Ez a hét'], ['month', 'Ez a hónap'], ['custom', 'Egyedi időszak']];
const REPORT_ROW_LIMIT = 200;
const fmtFull = s => parseD(s).toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric' });
const fmtNum = n => String(n).replace('.', ',');
const fmtMoney = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');   // 8 000, 16 000

function monthRange() {
  const d = parseD(todayStr());
  return { from: ymd(new Date(d.getFullYear(), d.getMonth(), 1)), to: ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
}
function periodRange() {
  const t = todayStr(), R = state.rep;
  if (R.period === 'today') return { from: t, to: t };
  if (R.period === 'week') {
    const from = addDays(t, -((parseD(t).getDay() + 6) % 7));   // hétfőtől vasárnapig
    return { from: from, to: addDays(from, 6) };
  }
  if (R.period === 'month') return monthRange();
  if (!R.from || !R.to) return { error: 'Add meg az időszak elejét és végét.' };
  if (R.from > R.to) return { error: 'Az időszak vége nem lehet a kezdete előtt.' };
  return { from: R.from, to: R.to };
}
function rangeText() {
  const r = periodRange();
  if (r.error) return '';
  return r.from === r.to ? fmtFull(r.from) : fmtFull(r.from) + ' – ' + fmtFull(r.to);
}

function sumRow(columns, rows) {
  return columns.map((c, i) => i === 0 ? 'Összesen' : c.num ? rows.reduce((a, r) => a + (Number(r[i]) || 0), 0) : '');
}

function runQuery() {
  const r = periodRange();
  if (r.error) return { error: r.error };
  const key = state.rep.query;
  const ss = state.data.sessions.filter(s => s.Datum >= r.from && s.Datum <= r.to);
  const cnt = (list, st) => list.filter(s => s.Statusz === st).length;
  const C = (label, num) => ({ label: label, num: !!num });
  const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
  let res;

  if (key === 'cases') {
    const by = {};
    ss.forEach(s => (by[s.Esetszam] = by[s.Esetszam] || []).push(s));
    const rows = Object.keys(by).sort((a, b) => a.localeCompare(b, 'hu')).map(id => {
      const c = caseById(id), l = by[id];
      return [id, c ? c.Nev : '', c ? c.Tervezett_alkalmak : 0, cnt(l, ST.HELD), cnt(l, ST.NOSHOW),
        cnt(l, ST.PLANNED), l.length, c ? c.stats.remaining : 0];
    });
    res = {
      columns: [C('Esetszám'), C('Név'), C('Tervezett alkalmak', 1), C('Megtartva', 1), C('Nem jelent meg', 1),
        C('Még tervezett', 1), C('Összes az időszakban', 1), C('Hátralévő (összesen)', 1)],
      rows: rows, summary: rows.length + ' eset üléssel az időszakban'
    };
    res.totals = rows.length ? sumRow(res.columns, rows) : null;

  } else if (key === 'noshow') {
    const list = ss.filter(s => s.Statusz === ST.NOSHOW);
    const base = cnt(ss, ST.HELD) + list.length;
    res = {
      columns: [C('Dátum'), C('Kezdés'), C('Esetszám'), C('Név'), C('Típus'), C('Megjegyzés')],
      rows: list.map(s => { const c = caseById(s.Esetszam); return [s.Datum, s.Kezdes, s.Esetszam, c ? c.Nev : '', s.Tipus, s.Megjegyzes]; }),
      summary: list.length + ' nem megjelenés, ' + new Set(list.map(s => s.Esetszam)).size + ' esetnél' +
        (base ? '. A megtartott és a meg nem jelent alkalmak ' + fmtNum(pct(list.length, base)) + '%-a.' : '')
    };

  } else if (key === 'types') {
    const types = state.data.settings.types.slice();
    ss.forEach(s => { if (s.Tipus && types.indexOf(s.Tipus) < 0) types.push(s.Tipus); });
    const rows = types.map(t => {
      const l = ss.filter(s => s.Tipus === t);
      return [t, l.length, cnt(l, ST.HELD), cnt(l, ST.NOSHOW), cnt(l, ST.PLANNED), pct(l.length, ss.length)];
    });
    res = {
      columns: [C('Típus'), C('Összes', 1), C('Megtartva', 1), C('Nem jelent meg', 1), C('Még tervezett', 1), C('Arány (%)', 1)],
      rows: rows, summary: ss.length + ' ülés típus szerint'
    };
    if (ss.length) { res.totals = sumRow(res.columns, rows); res.totals[5] = 100; } else { res.rows = []; }

  } else if (key === 'ages') {
    const ids = Array.from(new Set(ss.map(s => s.Esetszam)));
    const groups = {};
    ids.forEach(id => { const c = caseById(id); const age = (c && c.Eletkor) || 'Nincs megadva'; (groups[age] = groups[age] || []).push(id); });
    const order = a => a === 'Nincs megadva' ? 999 : AGE_OPTIONS.indexOf(a) >= 0 ? AGE_OPTIONS.indexOf(a) : 500;
    const rows = Object.keys(groups).sort((a, b) => order(a) - order(b) || a.localeCompare(b, 'hu')).map(age => {
      const l = ss.filter(s => groups[age].indexOf(s.Esetszam) >= 0);
      return [age, groups[age].length, l.length, cnt(l, ST.HELD), cnt(l, ST.NOSHOW), pct(groups[age].length, ids.length)];
    });
    res = {
      columns: [C('Életkor'), C('Esetek száma', 1), C('Ülések', 1), C('Megtartva', 1), C('Nem jelent meg', 1), C('Esetek aránya (%)', 1)],
      rows: rows, summary: ids.length + ' eset az időszakban, életkori kategóriák szerint'
    };
    if (rows.length) { res.totals = sumRow(res.columns, rows); res.totals[5] = 100; }

  } else {
    // havi kimutatás: számlázható alkalmak (megtartott + nem jelent meg), esetenként összesítve
    const list = ss.filter(s => s.Statusz === ST.HELD || s.Statusz === ST.NOSHOW);
    const price = state.rep.price;
    const mins = s => {
      const a = s.Kezdes.split(':').map(Number), b = s.Vege.split(':').map(Number);
      return Math.max(0, (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]));
    };
    // egy "óra" = egy 50 perces egység; a hosszabb alkalom többnek számít (fél egységre kerekítve)
    const units = s => Math.max(0.5, Math.round(mins(s) / SESSION_MINUTES * 2) / 2);
    const by = {};
    list.forEach(s => (by[s.Esetszam] = by[s.Esetszam] || []).push(s));
    // a "_24"-re végződő esetazonosítók a lista végére kerülnek
    const tail = id => /_24$/.test(id) ? 1 : 0;
    const ids = Object.keys(by).sort((x, y) => tail(x) - tail(y) || x.localeCompare(y, 'hu'));
    const rows = ids.map(id => {
      const l = by[id];
      const hours = l.reduce((a, s) => a + units(s), 0);
      return [id + ' / ' + l.length, hours, price, hours * price];
    });
    const unitCol = C('Egységár (HUF / 50 perc)', 1); unitCol.money = true;
    const totalCol = C('Össz. ár (HUF)', 1); totalCol.money = true;
    res = {
      columns: [C('Esetszám / ülések száma'), C('Óraszám (50 perc)', 1), unitCol, totalCol],
      rows: rows,
      summary: rows.length + ' eset, ' + list.length + ' ülés (' + cnt(list, ST.HELD) + ' megtartva, ' + cnt(list, ST.NOSHOW) +
        ' nem jelent meg), ' + fmtNum(rows.reduce((a, r) => a + r[1], 0)) + ' db 50 perces óra, összesen ' +
        fmtMoney(rows.reduce((a, r) => a + r[3], 0)) + ' HUF (' + fmtMoney(price) + ' HUF / 50 perces alkalom)'
    };
    if (rows.length) {
      res.totals = sumRow(res.columns, rows);
      res.totals[0] = 'Összesen (' + rows.length + ' eset / ' + list.length + ' ülés)';
      res.totals[2] = '';
    }
    res.list = ids.map(id => ({ id: id, count: by[id].length }));
    res.textSemi = res.list.map(x => x.id + '/' + x.count).join(';');
    res.textLines = res.list.map(x => x.id + '/' + x.count).join('\n');
  }
  res.key = key; res.range = r;
  if (!res.totals) res.totals = null;
  return res;
}

function copyText(text, taId, okMsg) {
  const done = () => toast(okMsg);
  const fallback = () => {
    const ta = taId && $('#' + taId);
    try { if (ta) { ta.focus(); ta.select(); if (document.execCommand('copy')) { done(); return; } } } catch (e) {}
    toast('A másolás nem sikerült, jelöld ki és másold a szöveget.', true);
  };
  if (text && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

function reportHtml() {
  if (state.rep.query === 'ai') return aiResultHtml();
  const res = runQuery();
  const q = QUERIES.find(x => x.key === state.rep.query);

  const th = res.columns.map(c => `<th class="${c.num ? 'num' : ''}">${esc(c.label)}</th>`).join('');

}

/* ---- Export: CSV és Excel (.xlsx, külső könyvtár nélkül) ---- */
/*EXPORT-START*/
function exportMatrix(res) {
  const rows = [res.columns.map(c => c.label)].concat(res.rows);
  if (res.totals) rows.push(res.totals);
  return rows;
}
function exportName(res, ext) {
  return 'konzultacio_' + res.key + '_' + res.range.from + '_' + res.range.to + '.' + ext;
}
function downloadBlob(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
}

function buildCsv(matrix) {
  const cell = v => {
    let s;
    if (typeof v === 'number') s = String(v).replace('.', ',');
    else {
      s = v == null ? '' : String(v);
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;   // képlet-injekció ellen
    }
    return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  // pontosvessző elválasztó + BOM: a magyar nyelvű Excel így nyitja meg helyesen
  return '\uFEFF' + matrix.map(r => r.map(cell).join(';')).join('\r\n') + '\r\n';
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data), size = data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  });
  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]),
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function colName(i) {
  let s = '', n = i + 1;
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function xmlEsc(v) {
  return String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
const H = 'http:' + String.fromCharCode(47, 47);   // az URL-ek elejét így állítjuk össze
function buildXlsx(matrix, hasTotals) {
  const lastIdx = matrix.length - 1;
  const widths = matrix[0].map((_, i) => Math.min(40, Math.max(10, ...matrix.map(r => String(r[i] == null ? '' : r[i]).length + 2))));
  const rowsXml = matrix.map((r, ri) => {
    const bold = ri === 0 || (hasTotals && ri === lastIdx) ? ' s="1"' : '';
    return `<row r="${ri + 1}">` + r.map((v, ci) => {
      const ref = colName(ci) + (ri + 1);
      if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${bold}><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${bold}><is><t xml:space="preserve">${xmlEsc(v == null ? '' : v)}</t></is></c>`;
    }).join('') + '</row>';
  }).join('');
  const NS = H + 'schemas.openxmlformats.org/spreadsheetml/2006/main';
  const REL = H + 'schemas.openxmlformats.org/officeDocument/2006/relationships';
  const head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  return zipStore([
    { name: '[Content_Types].xml', text: head + `<Types xmlns="${H}schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
    { name: '_rels/.rels', text: head + `<Relationships xmlns="${H}schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', text: head + `<workbook xmlns="${NS}" xmlns:r="${REL}"><bookViews><workbookView/></bookViews><sheets><sheet name="Lekérdezés" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', text: head + `<Relationships xmlns="${H}schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${REL}/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/styles.xml', text: head + `<styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
    { name: 'xl/worksheets/sheet1.xml', text: head + `<worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rowsXml}</sheetData></worksheet>` }
  ]);
}
/*EXPORT-END*/

function exportCurrent(kind) {
  const res = runQuery();
  if (res.error || !res.rows.length) { toast('Nincs exportálható adat.', true); return; }
  const matrix = exportMatrix(res);
  try {
    if (kind === 'csv') downloadBlob(exportName(res, 'csv'), new Blob([buildCsv(matrix)], { type: 'text/csv;charset=utf-8' }));
    else downloadBlob(exportName(res, 'xlsx'), buildXlsx(matrix, !!res.totals));
    toast('Fájl letöltése elindult');
  } catch (e) {
    toast('Az export nem sikerült: ' + e.message, true);
  }
}

/* ---------------- Megjelenítés ---------------- */
function render(keepScroll) {
  const y = window.scrollY;
  const app = $('#app');
  const { p, params } = route();
  if (!state.token || !apiReady()) {
    app.className = ''; app.innerHTML = viewLogin(); return;
  }
  if (!state.data) {
    app.className = '';
    app.innerHTML = `${topbar({ title: 'Konzultációk' })}${errorBar()}<main><div class="empty">${state.loadError ? 'Az adatok nem töltődtek be.' : 'Adatok betöltése…'}</div></main>`;
    return;
  }
  let html;
  if (p[0] === 'cases') html = viewCases();
  else if (p[0] === 'sessions') html = viewSessions();
  else if (p[0] === 'reports') html = viewReports();
  else if (p[0] === 'case' && p[1] === 'new') html = viewCaseForm(null);
  else if (p[0] === 'case' && p[2] === 'edit') html = viewCaseForm(p[1]);
  else if (p[0] === 'case' && p[1]) html = viewCase(p[1]);
  else if (p[0] === 'session' && p[1] === 'new') html = viewSessionForm(null, params);
  else if (p[0] === 'session' && p[2] === 'edit') html = viewSessionForm(p[1], params);
  else html = viewHome();
  app.className = isFormRoute() ? 'has-bar' : '';
  app.innerHTML = html;
  window.scrollTo(0, keepScroll ? y : 0);
}

}

function toast(msg, isErr) {

  $('#toast-msg').textContent = msg;
  t.className = 'toast' + (isErr ? ' err' : '');
  t.hidden = false;   // addig marad, amíg be nem zárod

      <button class="btn btn-ghost" data-act="copy-link" data-link="${esc(meetUrl(s))}">Link másolása</button>

    <div class="sgrid">
      ${state.data.settings.sessionStatuses.map(st =>
        `<button class="sbtn b-${stClass(st)} ${st === s.Statusz ? 'cur' : ''}" data-act="set-status" data-id="${esc(id)}" data-status="${esc(st)}">${esc(st)}</button>`).join('')}
    </div>
    <div class="sheet-links">

function caseExpirySheet(id) {
  const c = caseById(id); if (!c) return;
  const e = expiryOf(c), n = daysUntil(e);
  const when = n < 0 ? 'Lejárt: ' + fmtFull(e) : 'Lejár: ' + fmtFull(e) + (n === 0 ? ' (ma)' : ' (' + n + ' nap múlva)');

        `<button class="sbtn b-${stClass(st)} ${st === c.Statusz ? 'cur' : ''}" data-act="set-case-status" data-id="${esc(id)}" data-status="${esc(st)}">${esc(st)}</button>`).join('')}
    </div>
    <div class="sheet-links">
      <a class="btn btn-ghost" href="#/case/${encodeURIComponent(id)}" data-act="close-sheet">Eset megnyitása</a>

function caseStateSheet(id, to) {

  openSheet(`<div class="sheet-h"><div><b>${closing ? 'Eset lezárása' : 'Eset újranyitása'}</b><span>${esc(c.Nev)} (${esc(c.Esetszam)}) státusza ${esc(to)} lesz.</span></div></div>
    <div class="sheet-links">
      <button class="btn btn-ghost" data-act="close-sheet">Mégse</button>
      <button class="btn btn-primary" data-act="set-case-status" data-id="${esc(id)}" data-status="${esc(to)}">${closing ? 'Lezárás' : 'Újranyitás'}</button>
