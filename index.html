async function setCaseStatus(id, status, btn) {
  $('#sheet-panel').querySelectorAll('button').forEach(b => (b.disabled = true));
  if (btn) btn.textContent = 'Mentés\u2026';
  try {
    await call('setCaseStatus', { Esetszam: id, Statusz: status });
  } catch (e) {
    toast(e.message, true);
    caseExpirySheet(id);
    return;
  }
  closeSheet();
  toast('Az eset státusza: ' + status);
  if (!isFormRoute()) render(true);
}

async function setStatus(id, status, btn) {
  const all = $('#sheet-panel').querySelectorAll('.sbtn');
  all.forEach(b => (b.disabled = true));
  if (btn) btn.textContent = 'Mentés…';
  let meetErr = '';
  try {
    const r = await call('setSessionStatus', { Foglalkozas_ID: id, Statusz: status });
    if (r.result && r.result.meet && r.result.meet.error) meetErr = r.result.meet.error;
  } catch (e) {
    toast(e.message, true);
    sessionSheet(id);
    return;
  }
  closeSheet();
  if (meetErr) toast('Státusz mentve, de a naptári esemény nem frissült: ' + meetErr, true);
  else toast('Státusz mentve: ' + status);
  if (!isFormRoute()) render(true);
}

/* ---------------- Mentések ---------------- */
function setBusy(btn, busy, label) {
  if (!btn) return;
  btn.disabled = busy;
  btn.textContent = busy ? 'Mentés…' : label;
}
function clearErrors() {
  document.querySelectorAll('.fld.err').forEach(f => f.classList.remove('err'));
}
function fieldError(name, msg) {
  const f = document.querySelector(`.fld[data-f="${name}"]`);
  if (!f) { toast(msg, true); return; }
  f.classList.add('err');
  const m = f.querySelector('.msg'); if (m) m.textContent = msg;
  const inp = f.querySelector('input,select,textarea'); if (inp) inp.focus();
}

async function saveCase(id, btn) {
  clearErrors();
  const v = Object.fromEntries(new FormData($('#f')));
  if (!id) {
    v.Esetszam = (v.Esetszam || '').trim();
    if (!v.Esetszam) return fieldError('Esetszam', 'Add meg az esetszámot.');
    if (state.data.cases.some(c => c.Esetszam.toLowerCase() === v.Esetszam.toLowerCase())) {
      return fieldError('Esetszam', 'Ez az esetszám már létezik.');
    }
    v.isNew = true;
  } else {
    v.Esetszam = id;
  }
  v.WOS = $('input[name="WOS"]').checked;
  const wd = $('input[name="WOS_megvan"]');
  v.WOS_megvan = !!(v.WOS && wd && wd.checked);
  const fe = $('input[name="ElsoEmail"]');
  v.ElsoEmail = !!(fe && fe.checked);
  v.Nev = (v.Nev || '').trim();
  if (!v.Nev) return fieldError('Nev', 'Add meg a kliens nevét.');
  v.Kezdes_datum = (v.Kezdes_datum || '').trim();
  if (!id && !v.Kezdes_datum) return fieldError('Kezdes_datum', 'Add meg az eset kezdetét.');
  v.Kategoria = (v.Kategoria || '').replace(/\s+/g, ' ').trim();
  const rawPhone = (v.Telefonszam || '').trim();
  if (v.PhoneRaw) {
    v.Telefonszam = rawPhone;
  } else if (rawPhone) {
    const digits = huLocal(rawPhone);
    if (!/^\d{8,9}$/.test(digits)) return fieldError('Telefonszam', 'A +36 után 8 vagy 9 számjegyet adj meg, például 30 123 4567.');
    v.Telefonszam = '+36' + digits;
  } else {
    v.Telefonszam = '';
  }
  delete v.PhoneRaw;
  v.Email = (v.Email || '').trim();
  if (v.Email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.Email)) return fieldError('Email', 'Az e-mail cím formátuma hibás.');
  const n = parseInt(v.Tervezett_alkalmak, 10);
  if (isNaN(n) || n < 0 || n > 200) return fieldError('Tervezett_alkalmak', 'Adj meg 0 és 200 közötti számot.');
  v.Tervezett_alkalmak = n;
  const label = btn.textContent;
  setBusy(btn, true, label);
  try {
    const res = await call('saveCase', v);
    const mail = res.result && res.result.email;
    if (!id && mail && mail.error) toast('Eset létrehozva, de az egyeztető e-mail nem ment el: ' + mail.error, true);
    else if (!id && mail && mail.sent) toast('Eset létrehozva, az egyeztető e-mail elment');
    else toast(id ? 'Eset mentve' : 'Eset létrehozva: ' + res.result.Esetszam);
    go('#/case/' + encodeURIComponent(res.result.Esetszam), true);
  } catch (e) {
    toast(e.message, true);
    setBusy(btn, false, label);
  }
}

async function saveSession(btn, force) {
  clearErrors();
  const v = Object.fromEntries(new FormData($('#f')));
  const inv = $('input[name="Meghivo"]');
  v.Meghivo = !!(inv && inv.checked);
  if (!v.Esetszam) return fieldError('Esetszam', 'Válassz ki egy esetet.');
  if (!v.Datum) return fieldError('Datum', 'Add meg a dátumot.');
  if (!v.Kezdes) return fieldError('Kezdes', 'Add meg a kezdést.');
  if (!v.Vege) v.Vege = addMin(v.Kezdes, SESSION_MINUTES);
  if (v.Vege <= v.Kezdes) return fieldError('Vege', 'A végének a kezdés után kell lennie.');
  if (!v.Tipus) return toast('Válassz típust.', true);

  const cs = caseById(v.Esetszam), exp = cs ? expiryOf(cs) : '';
  if (exp && v.Datum > exp && !state.sessSkip.expiry) {
    openSheet(`<div class="sheet-h"><div><b>Az eset lejárata után</b><span>${esc(cs.Nev)} esete ${esc(fmtFull(exp))} napon lejár, az ülés ${esc(fmtFull(v.Datum))} napra van időzítve. Mégis mented?</span></div></div>
      <div class="sheet-links">
        <button class="btn btn-ghost" data-act="close-sheet">Vissza</button>
        <button class="btn btn-primary" data-act="force-save" data-skip="expiry">Mégis mentem</button>
      </div>`);
    return;
  }
  const clash = state.data.sessions.find(s =>
    s.Foglalkozas_ID !== v.Foglalkozas_ID &&
    s.Datum === v.Datum && (s.Statusz === ST.PLANNED || s.Statusz === ST.HELD) &&
    s.Kezdes < v.Vege && v.Kezdes < s.Vege);
  if (clash) {
    const c = caseById(clash.Esetszam);
    if (!state.sessSkip.clash) {
      openSheet(`<div class="sheet-h"><div><b>Időpont-ütközés</b><span>Ütközik ezzel: ${esc(c ? c.Nev : clash.Esetszam)}, ${esc(clash.Kezdes)}–${esc(clash.Vege)}. Mégis mented?</span></div></div>
        <div class="sheet-links">
          <button class="btn btn-ghost" data-act="close-sheet">Vissza</button>
          <button class="btn btn-primary" data-act="force-save">Mégis mentem</button>
        </div>`);
      return;
    }
  }
  const label = btn.textContent;
  setBusy(btn, true, label);
  try {
    const res = await call('saveSession', v);
    const m = res.result && res.result.meet;
    if (m && m.error) toast('Ülés mentve, de a Meet link nem készült el: ' + m.error, true);
    else if (m && m.warning) toast('Ülés mentve. ' + m.warning, true);
    else if (m && m.action === 'created') toast('Ülés mentve, Meet link létrehozva');
    else toast('Ülés mentve');
    go('#/case/' + encodeURIComponent(v.Esetszam), true);
  } catch (e) {
    toast(e.message, true);
    setBusy(btn, false, label);
  }
}

/* ---------------- Események ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'back':
      e.preventDefault();
      if (history.length > 1) history.back(); else go('#/');
      break;
    case 'refresh': loadData(); break;
    case 'login': {
      const val = ($('#token') || {}).value;
      if (!val || !val.trim()) { state.authError = 'Add meg a hozzáférési kódot.'; render(); break; }
      state.token = val.trim(); state.authError = ''; ls.set('kn_token', state.token);
      render(); loadData();
      break;
    }
    case 'case-filter':
      state.caseFilter = el.dataset.f;
      document.querySelectorAll('[data-act="case-filter"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === state.caseFilter)));
      $('#case-list').innerHTML = caseListHtml();
      break;
    case 'case-sort':
      state.caseSort = el.dataset.s;
      document.querySelectorAll('[data-act="case-sort"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === state.caseSort)));
      $('#case-list').innerHTML = caseListHtml();
      break;
    case 'sess-filter':
      state.sessFilter = el.dataset.f; render(); break;
    case 'show-pending':
      state.sessFilter = 'pending'; go('#/sessions'); break;
    case 'open-session': sessionSheet(el.dataset.id); break;
    case 'followup-one': followUpSheet([el.dataset.id]); break;
    case 'followup-all': followUpSheet(followUpCandidates().withEmail.map(c => c.Esetszam)); break;
    case 'followup-send': sendFollowUps(el.dataset.ids.split('|'), el); break;
    case 'case-state': caseStateSheet(el.dataset.id, el.dataset.to); break;
    case 'close-toast': closeToast(); break;
    case 'open-case-exp': caseExpirySheet(el.dataset.id); break;
    case 'set-case-status': setCaseStatus(el.dataset.id, el.dataset.status, el); break;
    case 'close-sheet': closeSheet(); break;
    case 'set-status': setStatus(el.dataset.id, el.dataset.status, el); break;
    case 'step': {
      const inp = $('input[name="Tervezett_alkalmak"]');
      const n = Math.max(0, Math.min(200, (parseInt(inp.value, 10) || 0) + Number(el.dataset.d)));
      inp.value = n; break;
    }
    case 'date-set': {
      $('input[name="Datum"]').value = addDays(todayStr(), Number(el.dataset.d)); updateExpiryNote(); syncPick(); break;
    }
    case 'date-add': {
      const inp = $('input[name="Datum"]');
      inp.value = addDays(inp.value || todayStr(), Number(el.dataset.d)); updateExpiryNote(); syncPick(); break;
    }
    case 'save-case': saveCase(el.dataset.id || '', el); break;
    case 'save-session': saveSession(el); break;
    case 'period':
      state.rep.period = el.dataset.p;
      if (el.dataset.p === 'custom' && !state.rep.from) { const m = monthRange(); state.rep.from = m.from; state.rep.to = m.to; }
      render(true); break;
    case 'query': state.rep.query = el.dataset.q; render(true); break;
    case 'export-csv': exportCurrent('csv'); break;
    case 'export-xlsx': exportCurrent('xlsx'); break;
    case 'copy-text': {
      const r = runQuery(), k = el.dataset.k;
      copyText(k === 'semi' ? r.textSemi : r.textLines, 'txt-' + k, 'A szöveg a vágólapra került');
      break;
    }
    case 'txt-text': {
      const r = runQuery(), k = el.dataset.k;
      if (!r || !r.list || !r.list.length) { toast('Nincs exportálható adat.', true); break; }
      const body = (k === 'semi' ? r.textSemi : r.textLines).replace(/\n/g, '\r\n') + '\r\n';
      downloadBlob('konzultacio_havi_' + (k === 'semi' ? 'pontosvesszos' : 'soronkent') + '_' + r.range.from + '_' + r.range.to + '.txt',
        new Blob([body], { type: 'text/plain;charset=utf-8' }));
      toast('Fájl letöltése elindult');
      break;
    }
    case 'ai-ask': askAi(); break;
    case 'copy-ai': {
      const done = () => toast('A válasz a vágólapra került');
      const fail = () => toast('A másolás nem sikerült, jelöld ki és másold a szöveget.', true);
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(state.rep.aiAnswer).then(done, fail); else fail();
      break;
    }
    case 'cal-prev': case 'cal-next': {
      const w = el.dataset.k === 'home' ? state.cal : state.pick;
      w.week = addDays(w.week || mondayOf(todayStr()), act === 'cal-prev' ? -7 : 7);
      refreshCal(el.dataset.k); break;
    }
    case 'cal-today': {
      (el.dataset.k === 'home' ? state.cal : state.pick).week = mondayOf(todayStr());
      refreshCal(el.dataset.k); break;
    }
    case 'cal-slot': {
      if (el.dataset.k === 'home') { go('#/session/new?date=' + el.dataset.date + '&time=' + el.dataset.time); break; }
      const dt = $('input[name="Datum"]'), st = $('input[name="Kezdes"]'), en = $('input[name="Vege"]');
      if (dt && st && en) {
        dt.value = el.dataset.date; st.value = el.dataset.time; en.value = addMin(el.dataset.time, SESSION_MINUTES);
        en.dataset.touched = '';
        updateExpiryNote(); syncPick();
      }
      break;
    }
    case 'cal-ext': {
      const list = ((state.ext[mondayOf(el.dataset.date)] || {}).events || [])
        .filter(x => x.id === el.dataset.id && x.date === el.dataset.date);
      if (list[0]) extSheet(list[0]);
      break;
    }
    case 'cal-busy': {
      const bs = sessionById(el.dataset.id), bc = bs ? caseById(bs.Esetszam) : null;
      toast(bs ? 'Foglalt: ' + (bc ? bc.Nev + ', ' : '') + bs.Kezdes + '\u2013' + bs.Vege : 'Foglalt időpont');
      break;
    }
    case 'pick-cat': {
      const inp = $('#cat-input');
      if (inp) inp.value = el.dataset.v;
      hideCatList();
      break;
    }
    case 'cat-toggle': {
      const box = $('#cat-list');
      if (box && !box.hidden) hideCatList(); else showCatList(true);
      break;
    }
    case 'copy-link': {
      const link = el.dataset.link || '';
      const done = () => toast('A link a vágólapra került');
      const fail = () => toast('A másolás nem sikerült, nyisd meg a linket és másold onnan.', true);
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, fail); else fail();
      break;
    }
    case 'force-save': state.sessSkip[el.dataset.skip || 'clash'] = true; closeSheet(); saveSession($('[data-act="save-session"]')); break;
  }
});

let searchTimer;
document.addEventListener('input', e => {
  if (e.target.id === 'ai-prompt') state.rep.aiPrompt = e.target.value;
  if (e.target.id === 'rep-price') {
    const n = Math.max(0, Math.round(Number(e.target.value) || 0));
    state.rep.price = n; ls.set('kn_price', String(n)); refreshReport();
  }
  if (e.target.id === 'cat-input') showCatList(false);
  if (e.target.id === 'q') {
    state.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { const l = $('#case-list'); if (l) l.innerHTML = caseListHtml(); }, 120);
  }
  if (e.target.name === 'Kezdes') {
    const end = $('input[name="Vege"]');
    if (end && !end.dataset.touched && e.target.value) end.value = addMin(e.target.value, SESSION_MINUTES);
  }
  if (e.target.name === 'Vege') e.target.dataset.touched = '1';
  if (e.target.name === 'Kezdes' || e.target.name === 'Vege') refreshCal('pick');
});

document.addEventListener('change', e => {
  if (e.target.name === 'WOS') { const b = $('#wos-done'); if (b) b.hidden = !e.target.checked; }
  if (e.target.name === 'Esetszam' || e.target.name === 'Datum') updateExpiryNote();
  if (e.target.name === 'Datum') syncPick();
  if (e.target.name === 'Kezdes' || e.target.name === 'Vege') refreshCal('pick');
  if (e.target.name === 'Kezdes_datum') {
    const cb = $('input[name="ElsoEmail"]');
    if (cb && e.target.value) cb.checked = e.target.value >= todayStr();   // már futó eset: nincs első egyeztető levél
  }
  if (e.target.name === 'Telefonszam' && e.target.closest('.phone')) e.target.value = huLocal(e.target.value);
  if (e.target.id === 'rep-from' || e.target.id === 'rep-to') {
    state.rep[e.target.id === 'rep-from' ? 'from' : 'to'] = e.target.value;
    refreshReport();
  }
});

document.addEventListener('focusin', e => { if (e.target.id === 'cat-input') showCatList(!e.target.value); });
document.addEventListener('focusout', e => { if (e.target.id === 'cat-input') setTimeout(hideCatList, 150); });
document.addEventListener('mousedown', e => { if (e.target.closest && e.target.closest('.combo-item, .combo-btn')) e.preventDefault(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); closeToast(); }
  if (e.key === 'Enter' && e.target.id === 'token') { e.preventDefault(); $('[data-act="login"]').click(); }
});

window.addEventListener('hashchange', () => { closeSheet(); render(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.token && !isFormRoute() && $('#sheet').hidden) loadData();
});

/* ---------------- Indítás ---------------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
render();
loadData();
</script>
</body>
</html>
