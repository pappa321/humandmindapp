<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Konzultációk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0E5A6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Konzultációk">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #EDF1F3;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #0E181D; }
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Az Apps Script web app /exec címe (Deploy > Manage deployments > Web app URL). Ha másik telepítést használsz, ezt cseréld le. -->

          src="https://script.google.com/macros/s/AKfycbxyCjaBnYHgMQ5oS5Dz0E18aGaKkHgDwckrdHb3pmt_AsYP8UDThAN1d_f7TGgBRBFk/exec"
          allow="clipboard-read; clipboard-write; fullscreen"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
